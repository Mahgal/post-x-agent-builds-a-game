<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — a tiny browser game built from one prompt</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #070b14;
    color: #e8f0ff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #39ff88;
    text-shadow: 0 0 18px rgba(57, 255, 136, .55);
  }
  h1 span { color: #ff5da2; text-shadow: 0 0 18px rgba(255, 93, 162, .55); }
  #hud {
    display: flex;
    gap: 28px;
    font-size: 17px;
    font-weight: 600;
  }
  #hud b { color: #ffd23e; }
  #board {
    background: #0b1220;
    border: 2px solid #1d2b45;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(57, 255, 136, .12), 0 0 0 4px #070b14;
    display: block;
  }
  #hint { font-size: 14px; color: #8fa3c8; text-align: center; line-height: 1.6; }
  #hint kbd {
    background: #1d2b45;
    border: 1px solid #33456b;
    border-radius: 4px;
    padding: 1px 7px;
    font-family: inherit;
    color: #e8f0ff;
  }
</style>
</head>
<body>
  <h1>Neon <span>Snake</span></h1>
  <div id="hud">
    <div>Score <b id="score">0</b></div>
    <div>Best <b id="best">0</b></div>
    <div>Speed <b id="speed">1×</b></div>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <p id="hint">
    <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer &nbsp;·&nbsp;
    <kbd>Space</kbd> pause &nbsp;·&nbsp; <kbd>R</kbd> restart<br>
    Eat the pink orbs to grow and score. Walls and your own tail end the run.
  </p>
<script>
"use strict";
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const speedEl = document.getElementById("speed");

const CELL = 24;                 // pixels per grid cell
const COLS = canvas.width / CELL;  // 20
const ROWS = canvas.height / CELL; // 20
const BEST_KEY = "neon-snake-best";

let snake, dir, pendingDir, food, score, best, tickMs, timer, state;

function loadBest() {
  try { return Number(localStorage.getItem(BEST_KEY)) || 0; }
  catch (e) { return 0; }
}
function saveBest() {
  try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) { /* private mode */ }
}

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  pendingDir = dir;
  score = 0;
  tickMs = 140;
  state = "ready";
  placeFood();
  draw();
  updateHud();
}

function placeFood() {
  while (true) {
    const p = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    if (!snake.some(s => s.x === p.x && s.y === p.y)) { food = p; return; }
  }
}

function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  speedEl.textContent = (140 / tickMs).toFixed(1) + "×";
}

function step() {
  if (state !== "playing") return;
  dir = pendingDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  // Walls end the run.
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();
  // Your own tail ends the run (the tail cell being vacated this step is safe).
  const body = snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (score > best) { best = score; saveBest(); }
    tickMs = Math.max(70, tickMs - 4);   // faster with every orb
    placeFood();
  } else {
    snake.pop();
  }
  draw();
  updateHud();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(step, tickMs);
}

function start() {
  if (state === "over") reset();
  state = "playing";
  draw();
  schedule();
}

function pause() {
  if (state === "playing") { state = "paused"; clearTimeout(timer); draw(); }
  else if (state === "paused") { state = "playing"; schedule(); }
}

function gameOver() {
  state = "over";
  clearTimeout(timer);
  draw();
  updateHud();
}

function draw() {
  ctx.fillStyle = "#0b1220";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // faint grid
  ctx.strokeStyle = "rgba(61, 90, 140, .18)";
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
  }
  // food: glowing pink orb
  const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
  ctx.fillStyle = "#ff5da2";
  ctx.shadowColor = "#ff5da2"; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(fx, fy, 8, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  // snake: green gradient body, bright head
  snake.forEach((s, i) => {
    const t = i / Math.max(1, snake.length - 1);
    const g = Math.round(255 - t * 120);
    ctx.fillStyle = i === 0 ? "#39ff88" : `rgb(46, ${g}, 120)`;
    if (i === 0) { ctx.shadowColor = "#39ff88"; ctx.shadowBlur = 14; }
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    ctx.shadowBlur = 0;
  });
  // overlays
  if (state === "ready" || state === "over" || state === "paused") {
    ctx.fillStyle = "rgba(7, 11, 20, .72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e8f0ff";
    ctx.textAlign = "center";
    ctx.font = "bold 34px 'Segoe UI', system-ui, sans-serif";
    if (state === "ready") {
      ctx.fillText("NEON SNAKE", canvas.width / 2, canvas.height / 2 - 30);
      ctx.font = "16px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "#8fa3c8";
      ctx.fillText("Press Enter or Space to start", canvas.width / 2, canvas.height / 2 + 12);
    } else if (state === "paused") {
      ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "16px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "#8fa3c8";
      ctx.fillText("Press Space to resume", canvas.width / 2, canvas.height / 2 + 24);
    } else {
      ctx.fillStyle = "#ff5da2";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 40);
      ctx.fillStyle = "#e8f0ff";
      ctx.font = "20px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("Score " + score + "   ·   Best " + best, canvas.width / 2, canvas.height / 2 + 2);
      ctx.font = "16px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "#8fa3c8";
      ctx.fillText("Press R or Enter to play again", canvas.width / 2, canvas.height / 2 + 36);
    }
  }
}

const KEYS = {
  ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
};

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); state === "ready" ? start() : pause(); return; }
  if (e.code === "Enter") { e.preventDefault(); if (state !== "playing") start(); return; }
  if (e.code === "KeyR") { reset(); start(); return; }
  const next = KEYS[e.code];
  if (!next) return;
  e.preventDefault();
  // no reversing straight into yourself
  if (next.x === -dir.x && next.y === -dir.y) return;
  pendingDir = next;
  if (state === "ready") start();
});

best = loadBest();
reset();
</script>
</body>
</html>
